name: Deploy demo site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir site
          cp public/index.html site/
          node -e "const fs=require('fs'),p=require('path');const forms=fs.readdirSync('forms').filter(f=>f.endsWith('.json')).map(f=>({id:p.basename(f,'.json'),...JSON.parse(fs.readFileSync(p.join('forms',f),'utf8'))})).sort((a,b)=>a.name.localeCompare(b.name));fs.writeFileSync('site/forms.json',JSON.stringify(forms))"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
